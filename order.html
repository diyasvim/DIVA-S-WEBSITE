<!DOCTYPE html>
<html>
<head>
  <title>Food Order</title>

  <style>
    body {
      background: #f3ead8;
      color: #174c3c;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .foods {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .food {
      width: 280px;
      background: #fffdf8;
      padding: 15px;
    }

    .food img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .food a {
      display: inline-block;
      background: #174c3c;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <h1>ORDER FOOD</h1>

  <div class="foods">

    <div class="food">
      <img src="https://wpcontents.weddingpark.net/image/hall/1fc7/thumb640x480/GGJaHXa48xaLSJ54iJRRVOBodIpRUY1q.jpg?format=webp"
           alt="Chef's special">
      <h2>CHEF'S SPECIAL</h2>
      <p>Price: ₹450</p>
      <a href="#">PAY NOW</a>
    </div>

    <div class="food">
      <img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=900"
           alt="Fine dining dish">
      <h2>FINE DINING</h2>
      <p>Price: ₹550</p>
      <a href="#">PAY NOW</a>
    </div>

    <div class="food">
      <img src="https://images.unsplash.com/photo-1547592180-85f173990554?w=900"
           alt="Signature dish">
      <h2>SIGNATURE DISH</h2>
      <p>Price: ₹500</p>
      <a href="#">PAY NOW</a>
    </div>

  </div>
</body>
</html>
